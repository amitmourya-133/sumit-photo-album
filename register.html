<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - QR Photo Album</title>
<link rel="stylesheet" href="css/admin.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.register-container{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:480px;padding:40px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:28px;color:#333;margin-bottom:4px}
.logo p{color:#666;font-size:14px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;color:#333;font-size:14px}
.input-wrapper{position:relative}
.form-group input{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#667eea}
.toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#999;padding:4px}
.toggle-password:hover{color:#667eea}
.checkbox-group{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px}
.checkbox-group input[type="checkbox"]{width:18px;height:18px;margin-top:2px;cursor:pointer;accent-color:#667eea}
.checkbox-group label{font-size:14px;color:#555;line-height:1.4}
.checkbox-group a{color:#667eea;text-decoration:none}
.checkbox-group a:hover{text-decoration:underline}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:16px;font-weight:600;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(102,126,234,.4)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.loading{display:none;text-align:center;margin:12px 0}
.loading span{display:inline-block;width:20px;height:20px;border:3px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.message{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;display:none}
.message.success{background:#e8f5e9;color:#2e7d32;display:block}
.message.error{background:#ffebee;color:#c62828;display:block}
.divider{text-align:center;margin:24px 0;color:#999;font-size:14px}
.login-link{text-align:center;margin-top:16px}
.login-link a{color:#667eea;text-decoration:none;font-weight:600}
.login-link a:hover{text-decoration:underline}
.password-strength{height:4px;background:#e0e0e0;border-radius:2px;margin-top:6px;overflow:hidden}
.password-strength-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0%}
@media(max-width:480px){.register-container{padding:24px}.logo h1{font-size:24px}}
</style>
</head>
<body>
<div class="register-container">
<div class="logo">
<h1>📸 QR Photo Album</h1>
<p>Create Your Account</p>
</div>
<div class="message" id="message"></div>
<form id="registerForm">
<div class="form-group">
<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your full name" required autocomplete="name">
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
</div>
<div class="form-group">
<label for="password">Password</label>
<div class="input-wrapper">
<input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
<button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
</div>
<div class="password-strength"><div class="password-strength-bar" id="strengthBar"></div></div>
</div>
<div class="form-group">
<label for="confirmPassword">Confirm Password</label>
<div class="input-wrapper">
<input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
<button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</button>
</div>
</div>
<div class="checkbox-group">
<input type="checkbox" id="acceptTerms" name="acceptTerms" required>
<label for="acceptTerms">I agree to the <a href="#" onclick="alert('Terms of Service');return false">Terms of Service</a> and <a href="#" onclick="alert('Privacy Policy');return false">Privacy Policy</a></label>
</div>
<button type="submit" class="btn" id="registerBtn">Create Account</button>
<div class="loading" id="loading"><span></span></div>
</form>
<div class="divider">or</div>
<div class="login-link">
Already have an account? <a href="/login.html">Log in</a>
</div>
</div>
<script>
function togglePassword(id){
const input=document.getElementById(id);
const btn=event.target;
if(input.type==='password'){input.type='text';btn.textContent='🙈';}
else{input.type='password';btn.textContent='👁️';}
}
function updateStrength(){
const pw=document.getElementById('password').value;
const bar=document.getElementById('strengthBar');
let score=0;
if(pw.length>=8)score++;
if(/[A-Z]/.test(pw))score++;
if(/[a-z]/.test(pw))score++;
if(/[0-9]/.test(pw))score++;
if(/[^A-Za-z0-9]/.test(pw))score++;
const colors=['#f44336','#ff9800','#ffc107','#8bc34a','#4caf50'];
const widths=['20%','40%','60%','80%','100%'];
bar.style.width=widths[score]||'0%';
bar.style.background=colors[score]||'#e0e0e0';
}
document.getElementById('password').addEventListener('input',updateStrength);
document.getElementById('registerForm').addEventListener('submit',async function(e){
e.preventDefault();
const msg=document.getElementById('message');
const btn=document.getElementById('registerBtn');
const loading=document.getElementById('loading');
msg.style.display='none';
msg.className='message';
btn.disabled=true;
loading.style.display='block';
const name=document.getElementById('name').value;
const email=document.getElementById('email').value;
const password=document.getElementById('password').value;
const confirmPassword=document.getElementById('confirmPassword').value;
const acceptTerms=document.getElementById('acceptTerms').checked;
try{
const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,confirmPassword,acceptTerms})});
const data=await res.json();
if(res.ok && data.success){
msg.className='message success';
msg.textContent=data.message||'Account created successfully! Redirecting to login...';
msg.style.display='block';
setTimeout(()=>window.location.href='/login.html',2000);
}else{
msg.className='message error';
msg.textContent=data.error||'Registration failed';
msg.style.display='block';
}
}catch(err){
msg.className='message error';
msg.textContent='Error connecting to server';
msg.style.display='block';
}
btn.disabled=false;
loading.style.display='none';
});
</script>
</body>
</html>
