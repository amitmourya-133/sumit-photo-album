<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photo Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #000; overflow: hidden; height: 100dvh; }
    #album { width: 100vw; height: 100dvh; position: relative; }
    #photo { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s; }
    #photo.fade { opacity: 0; }
    #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.75); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; cursor: pointer; z-index: 10; }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 2rem; margin-bottom: 12px; padding: 0 20px; }
    #playMusicBtn { margin-top: 20px; padding: 12px 24px; background: #ff6b9d; color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; display: none; }
    #counter { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; z-index: 5; }
    #controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 5; }
    .ctrl { background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 1.2rem; cursor: pointer; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; }
    #loading.hidden { display: none; }
    #notfound { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
    #notfound.visible { display: flex; }
    #notfound a { color: #ff6b9d; margin-top: 20px; }
    .romantic { background: linear-gradient(135deg, #ffe4e9 0%, #ffb6c1 100%); }
  </style>
</head>
<body>
  <div id="album">
    <img id="photo" alt="Photo" decoding="async" loading="eager">
    <div id="loading">Loading album...</div>
    <div id="overlay">
      <h1 id="albumTitle">Photo Album</h1>
      <p id="albumMsg">Tap to begin</p>
      <button id="playMusicBtn">▶ Play Music</button>
    </div>
    <div id="counter">0 / 0</div>
    <div id="controls">
      <button class="ctrl" id="prev" aria-label="Previous">◀</button>
      <button class="ctrl" id="playpause" aria-label="Play/Pause">⏸</button>
      <button class="ctrl" id="next" aria-label="Next">▶</button>
    </div>
    <audio id="audio" loop preload="auto"></audio>
    <div id="notfound">
      <h1>Album Not Found</h1>
      <p>This album may have been deleted or the link is incorrect.</p>
      <a href="/create.html">Create Your Own Album</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || (location.pathname.split('/album/')[1] || '').split('?')[0];
    const photo = document.getElementById('photo');
    const overlay = document.getElementById('overlay');
    const loading = document.getElementById('loading');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const playpause = document.getElementById('playpause');
    const audio = document.getElementById('audio');
    const notfound = document.getElementById('notfound');
    const playMusicBtn = document.getElementById('playMusicBtn');
    let album = null, idx = 0, timer = null, playing = true, photos = [];

    async function load() {
      try {
        const res = await fetch('/api/album/' + encodeURIComponent(id));
        if (!res.ok) throw new Error('not found');
        album = await res.json();
        document.getElementById('albumTitle').textContent = album.title || 'Photo Album';
        document.getElementById('albumMsg').textContent = album.settings?.openingMsg || 'Tap to begin';
        if (album.settings?.romanticTheme) document.body.classList.add('romantic');
        photos = Array.isArray(album.photos) ? album.photos : [];
        if (album.music && album.music.src) {
          audio.src = album.music.src;
          audio.volume = typeof album.settings?.musicVolume === 'number' ? album.settings.musicVolume : 0.7;
        }
        loading.classList.add('hidden');
        update();
      } catch(e) {
        loading.classList.add('hidden');
        notfound.classList.add('visible');
      }
    }

    function update() {
      if (!photos.length) {
        counter.textContent = '0 / 0';
        return;
      }
      idx = ((idx % photos.length) + photos.length) % photos.length;
      photo.classList.add('fade');
      setTimeout(() => {
        photo.src = photos[idx];
        photo.decoding = 'async';
        photo.loading = 'eager';
        counter.textContent = (idx + 1) + ' / ' + photos.length;
        setTimeout(() => photo.classList.remove('fade'), 50);
      }, 200);
    }

    function nextPhoto() { if (!photos.length) return; idx++; update(); resetTimer(); }
    function prevPhoto() { if (!photos.length) return; idx--; update(); resetTimer(); }
    function resetTimer() {
      if (timer) clearInterval(timer);
      if (!photos.length) return;
      const d = Math.max(3, Math.min(5, album?.settings?.duration || 3)) * 1000;
      timer = setInterval(nextPhoto, d);
    }

    async function startMusic() {
      if (!audio.src) return;
      try {
        await audio.play();
        playMusicBtn.style.display = 'none';
      } catch(e) {
        playMusicBtn.style.display = 'inline-block';
      }
    }

    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      startMusic();
      resetTimer();
    });
    playMusicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startMusic();
    });
    next.addEventListener('click', nextPhoto);
    prev.addEventListener('click', prevPhoto);
    playpause.addEventListener('click', () => {
      if (playing) {
        if (timer) clearInterval(timer);
        playpause.textContent = '▶';
        playing = false;
      } else {
        resetTimer();
        playpause.textContent = '⏸';
        playing = true;
      }
    });
    load();
  </script>
</body>
</html>
