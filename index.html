<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d15">
  <title>QR Photo Album</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root">
    <div class="photo-wrapper">
      <img id="photo" alt="Album photo" decoding="async">
      <div id="photo-fallback" hidden>
        <h2>Photo unavailable</h2>
        <p id="fallback-message">This photo could not be loaded.</p>
        <button id="fallback-retry" type="button">Retry</button>
      </div>
    </div>

    <div id="tap-overlay">
      <h1>Photo Album</h1>
      <p id="tap-overlay-text">Tap screen to begin</p>
      <div class="tap-inst">or swipe left / right</div>
    </div>

    <div id="photo-counter" aria-live="polite">0 / 0</div>

    <audio id="bg-audio" loop preload="metadata"></audio>

    <div id="music-panel" hidden>
      <div class="music-head">
        <span>Music</span>
        <button id="music-close" type="button" aria-label="Close music controls">&times;</button>
      </div>
      <div id="track-current">No track selected</div>
      <select id="track-select" aria-label="Choose track"></select>
      <div class="music-buttons">
        <button id="music-play" type="button" disabled>Play</button>
        <button id="music-mute" type="button" disabled>Mute</button>
      </div>
      <label class="volume-label" for="music-volume">Volume <output id="volume-value">80%</output></label>
      <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.8">
      <p id="music-status" role="status"></p>
    </div>

    <button id="music-toggle" type="button" aria-label="Open music controls" aria-expanded="false">&#9834;</button>
    <button id="prev" type="button" aria-label="Previous photo">&#10094;</button>
    <button id="next" type="button" aria-label="Next photo">&#10095;</button>
  </div>

  <noscript>This album requires JavaScript to display photos.</noscript>
  <script src="js/slideshow.js"></script>
</body>
</html>
