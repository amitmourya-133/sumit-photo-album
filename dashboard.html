<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - QR Photo Album</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;min-height:100vh}
.topbar{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.topbar h1{font-size:22px}
.topbar button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer}
.container{max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn.primary{background:#667eea;color:#fff}
.btn.secondary{background:#e0e0e0;color:#333}
.album{border:1px solid #eee;border-radius:8px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.album h3{margin-bottom:4px}
.album p{color:#666;font-size:13px}
.album .btns{display:flex;gap:8px;flex-wrap:wrap}
.status{padding:12px;border-radius:8px;margin-bottom:16px}
.status.ok{background:#e8f5e9;color:#2e7d32}
.status.err{background:#ffebee;color:#c62828}
</style>
</head>
<body>
<div class="topbar">
<h1>QR Photo Album Dashboard</h1>
<button id="logoutBtn">Logout</button>
</div>
<div class="container">
<div id="status" class="status" style="display:none"></div>
<div class="card">
<div class="actions">
<a href="/create.html" class="btn primary" style="text-decoration:none;display:inline-block">+ Create New Album</a>
<button class="btn secondary" id="refreshBtn">Refresh Albums</button>
</div>
<div id="albums">Loading albums...</div>
</div>
</div>
<script>
async function checkAuth(){
const r=await fetch('/api/auth/me');
const d=await r.json();
if(!r.ok||!d.authenticated){window.location.href='/login.html';return false;}
return true;
}
function showStatus(msg,type){const el=document.getElementById('status');el.textContent=msg;el.className='status '+(type||'ok');el.style.display='block';}
async function loadAlbums(){
const el=document.getElementById('albums');
el.textContent='Loading...';
try{
const r=await fetch('/api/albums');
if(r.status===401){window.location.href='/login.html';return;}
const d=await r.json();
if(!Array.isArray(d.albums)||d.albums.length===0){el.innerHTML='<p>No albums yet. Create your first album!</p>';return;}
el.innerHTML=d.albums.map(a=>`
<div class="album">
<div>
<h3>${escapeHtml(a.title||'Untitled Album')}</h3>
<p>${a.photoCount||0} photos · ${a.id}</p>
</div>
<div class="btns">
<a href="/album.html?id=${encodeURIComponent(a.id)}" target="_blank" class="btn secondary" style="text-decoration:none">View</a>
<button class="btn secondary" onclick="copyLink('${a.url||''}')">Copy Link</button>
</div>
</div>`).join('');
}catch(e){el.innerHTML='<p class="status err">Failed to load albums.</p>';}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function copyLink(url){if(!url){alert('No link');return;}navigator.clipboard.writeText(url).then(()=>showStatus('Link copied!','ok'));}
document.getElementById('logoutBtn').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST'});window.location.href='/login.html';});
document.getElementById('refreshBtn').addEventListener('click',loadAlbums);
(async()=>{if(await checkAuth()) loadAlbums();})();
</script>
</body>
</html>
