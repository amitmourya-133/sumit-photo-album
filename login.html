<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login - QR Photo Album</title><link rel='stylesheet' href='./css/admin.min.css'><style>body{font-family:sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:400px;max-width:90%}.login-box h1{margin-top:0;text-align:center;color:#333}.form-group{margin-bottom:20px}.form-group label{display:block;margin-bottom:5px;font-weight:bold;color:#333}.form-group input{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;box-sizing:border-box;font-size:15px}.input-wrapper{position:relative}.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#999}.btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600}.btn:hover{opacity:.9}.btn:disabled{opacity:.6;cursor:not-allowed}.error{color:#c62828;margin-top:10px;text-align:center;font-size:14px}.loading{display:none;text-align:center;margin:12px 0}.loading span{display:inline-block;width:20px;height:20px;border:3px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.divider{text-align:center;margin:20px 0;color:#999;font-size:14px}.register-link{text-align:center;margin-top:16px;font-size:14px}.register-link a{color:#667eea;text-decoration:none;font-weight:600}.register-link a:hover{text-decoration:underline}</style></head><body><div class='login-box'><h1>QR Photo Album</h1><p style='text-align:center;color:#666;margin-bottom:24px'>Sign in to your account</p><form id='loginForm'><div class='form-group'><label for='username'>Email or Username</label><input type='text' id='username' name='username' required autocomplete='username'></div><div class='form-group'><label for='password'>Password</label><div class='input-wrapper'><input type='password' id='password' name='password' required autocomplete='current-password'><button type='button' class='toggle-password' onclick="togglePassword('password')">👁️</button></div></div><button type='submit' class='btn' id='loginBtn'>Sign In</button><div class='loading' id='loading'><span></span></div><div id='error' class='error'></div></form><div class='divider'>or</div><div class='register-link'>Don't have an account? <a href='/register.html'>Create Account</a></div></div><script>function togglePassword(id){const input=document.getElementById(id);const btn=event.target;if(input.type==='password'){input.type='text';btn.textContent='🙈';}else{input.type='password';btn.textContent='👁️';}}document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();const username=document.getElementById('username').value;const password=document.getElementById('password').value;const errorDiv=document.getElementById('error');const btn=document.getElementById('loginBtn');const loading=document.getElementById('loading');errorDiv.textContent='';btn.disabled=true;loading.style.display='block';try{const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await res.json();if(res.ok){window.location.href='/dashboard.html';}else{errorDiv.textContent=data.error||'Login failed';}}catch(err){errorDiv.textContent='Error connecting to server';}btn.disabled=false;loading.style.display='none';});</script></body></html>
